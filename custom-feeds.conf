# Extra package feeds for feeds-manager.sh.
# Format: enabled|feed_name|git_url|branch
#
# enabled: 1 = add this feed during the build; 0 = keep it disabled.
# branch:  use - to use the repository default branch.
#
# Examples (uncomment and replace with a feed compatible with your source branch):
# 1|myfeed|https://github.com/example/openwrt-feed|main
# 0|disabled-feed|https://github.com/example/another-openwrt-feed|-
