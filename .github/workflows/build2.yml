name: Build ImmortalWrt 2

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ImmortalWrt branch, tag, or commit (v25.12.2 series: openwrt-25.12)"
        required: true
        default: "openwrt-25.12"
        type: string
      release:
        description: "Create a GitHub Release"
        required: true
        default: false
        type: boolean
      clean:
        description: "Run make clean before compiling"
        required: true
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check ImmortalWrt version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
      
          echo "Checking ImmortalWrt version: ${VERSION}"
      
          TAG_INFO="$(git ls-remote --tags \
            "${REPO_URL}" \
            "refs/tags/${VERSION}")"
      
          if [ -n "$TAG_INFO" ]; then
      
            COMMIT="$(echo "$TAG_INFO" | awk '{print $1}')"
      
            echo "========================================"
            echo "ImmortalWrt version exists."
            echo "Version : ${VERSION}"
            echo "Commit  : ${COMMIT}"
            echo "========================================"
      
          else
      
            echo "ERROR: ImmortalWrt tag '${VERSION}' does not exist!"
            exit 1
      
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      
          echo "OK: ImmortalWrt tag '${VERSION}' exists."

      - name: Clone requested ImmortalWrt source
        id: source
        env:
          SOURCE_REF: ${{ inputs.version }}
        run: |
          set -euo pipefail

          mkdir immortalwrt
          git -C immortalwrt init
          git -C immortalwrt remote add origin "$REPO_URL"

          # Accepts a branch, tag, or reachable commit SHA.
          git -C immortalwrt -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$SOURCE_REF"
          git -C immortalwrt checkout --detach FETCH_HEAD

          SOURCE_COMMIT="$(git -C immortalwrt rev-parse HEAD)"
          SOURCE_VERSION="$(git -C immortalwrt describe --tags --always)"
          REF_SLUG="$(printf '%s' "$SOURCE_REF" | tr -cs 'A-Za-z0-9._-' '-' | sed -e 's/^-*//' -e 's/-*$//')"
          REF_SLUG="${REF_SLUG:-source}"

          {
            echo "commit=$SOURCE_COMMIT"
            echo "display_version=$SOURCE_VERSION"
            echo "ref_slug=$REF_SLUG"
          } >> "$GITHUB_OUTPUT"

          echo "Requested source: $SOURCE_REF"
          echo "Resolved version: $SOURCE_VERSION"
          echo "Resolved commit: $SOURCE_COMMIT"

      - name: Set default LAN IP
        if: steps.check_release.outputs.should_build == 'true'
        working-directory: immortalwrt
        shell: bash
        run: |
          set -euo pipefail
      
          CONFIG_FILE="package/base-files/files/bin/config_generate"
      
          echo "Before modification:"
          grep -n 'lan) ipad=' "$CONFIG_FILE" || true
      
          if grep -q 'lan) ipad=${ipaddr:-"192.168.1.1"} ' "$CONFIG_FILE"; then
      
            sed -i \
              's/lan) ipad=${ipaddr:-"192.168.1.1"} /lan) ipad=${ipaddr:-"192.168.31.91"} /g' \
              "$CONFIG_FILE"
      
          else
      
            echo "ERROR: Expected LAN IP configuration was not found."
            exit 1
      
          fi
      
          echo "After modification:"
          grep -n 'lan) ipad=' "$CONFIG_FILE"
      
          if ! grep -q 'lan) ipad=${ipaddr:-"192.168.31.91"} ' "$CONFIG_FILE"; then
            echo "ERROR: LAN IP modification failed."
            exit 1
          fi
      
          echo "Default LAN IP successfully changed to 192.168.31.91"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: immortalwrt-ccache-${{ runner.os }}-${{ steps.source.outputs.ref_slug }}-${{ hashFiles('.config') }}
          restore-keys: |
            immortalwrt-ccache-${{ runner.os }}-${{ steps.source.outputs.ref_slug }}-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --set-config=cache_dir="$HOME/.ccache"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          ccache -z

      - name: Update feeds
        working-directory: immortalwrt
        run: ./scripts/feeds update -a

      - name: Install feeds
        working-directory: immortalwrt
        run: ./scripts/feeds install -a

      - name: Copy configuration
        run: |
          set -euo pipefail
          if [ ! -f .config ]; then
            echo "ERROR: .config was not found in the configuration repository."
            exit 1
          fi

          cp .config immortalwrt/.config

          if ! grep -qx 'CONFIG_CCACHE=y' immortalwrt/.config; then
            echo "WARNING: CONFIG_CCACHE=y is absent from .config; ccache will not accelerate this build."
          fi

          grep -E 'CONFIG_TARGET_|CONFIG_DEFAULT_TARGET_|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_kmod' \
            immortalwrt/.config | head -100 || true

      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          make defconfig
          grep '^CONFIG_TARGET_' .config | head -50 || true

      - name: Clean build directory
        if: ${{ inputs.clean }}
        working-directory: immortalwrt
        run: make clean

      - name: Download sources
        working-directory: immortalwrt
        run: make download -j"$(nproc)" V=s

      - name: Build firmware
        working-directory: immortalwrt
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" world 2>&1 | tee build.log

      - name: Retry failed build with verbose output
        if: failure()
        working-directory: immortalwrt
        shell: bash
        run: |
          set -o pipefail
          make -j1 V=s 2>&1 | tee build-retry.log

      - name: Show build information
        if: always()
        working-directory: immortalwrt
        run: |
          df -h
          ccache -s || true
          test ! -f build.log || tail -100 build.log
          find bin/targets -type f \
            \( -name '*.bin' -o -name '*.img' -o -name '*.vmdk' -o -name '*.gz' \
            -o -name '*.manifest' -o -name 'sha256sums' \) -print 2>/dev/null || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            immortalwrt/build.log
            immortalwrt/build-retry.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ steps.source.outputs.ref_slug }}-${{ github.run_number }}
          path: immortalwrt/bin/targets/**
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release files
        if: ${{ success() && inputs.release }}
        working-directory: immortalwrt
        env:
          SOURCE_REF: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_VERSION: ${{ steps.source.outputs.display_version }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          mkdir -p ../release

          echo "Searching for release images..."

          ISO_FILE="$(find bin/targets -type f -name 'immortalwrt-x86-64-generic-image-efi.iso' -print -quit)"
          VMDK_FILE="$(find bin/targets -type f -name 'immortalwrt-x86-64-generic-ext4-combined-efi.vmdk.gz' -print -quit)"
          IMG_FILE="$(find bin/targets -type f -name 'immortalwrt-x86-64-generic-ext4-combined-efi.img.gz' -print -quit)"

          if [ -z "$ISO_FILE" ]; then
            echo "ERROR: immortalwrt-x86-64-generic-image-efi.iso was not generated."
            exit 1
          fi

          if [ -z "$VMDK_FILE" ]; then
            echo "ERROR: immortalwrt-x86-64-generic-ext4-combined-efi.vmdk.gz was not generated."
            exit 1
          fi

          if [ -z "$IMG_FILE" ]; then
            echo "ERROR: immortalwrt-x86-64-generic-ext4-combined-efi.img.gz was not generated."
            exit 1
          fi

          # Add the requested release version to the asset filenames.
          cp "$ISO_FILE" \
            "../release/ImmortalWrt-${RELEASE_VERSION}-x86-64-generic-image-efi.iso"

          cp "$VMDK_FILE" \
            "../release/ImmortalWrt-${RELEASE_VERSION}-x86-64-generic-ext4-combined-efi.vmdk.gz"

          cp "$IMG_FILE" \
            "../release/ImmortalWrt-${RELEASE_VERSION}-x86-64-generic-ext4-combined-efi.img.gz"

          # Generate checksums for the three release assets.
          (
            cd ../release
            sha256sum \
              "ImmortalWrt-${RELEASE_VERSION}-x86-64-generic-image-efi.iso" \
              "ImmortalWrt-${RELEASE_VERSION}-x86-64-generic-ext4-combined-efi.vmdk.gz" \
              "ImmortalWrt-${RELEASE_VERSION}-x86-64-generic-ext4-combined-efi.img.gz" \
              > SHA256SUMS
          )

          cat > ../release/build-info.txt <<EOF
          ImmortalWrt custom build
          Release version: ${RELEASE_VERSION}
          Requested source: ${SOURCE_REF}
          Resolved source: ${SOURCE_VERSION}
          ImmortalWrt commit: ${SOURCE_COMMIT}
          Configuration repository commit: ${GITHUB_SHA}
          Build run: ${GITHUB_RUN_NUMBER}
          Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          EOF

          echo "Release files:"
          ls -lh ../release
      - name: Create GitHub Release
        if: ${{ success() && inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: immortalwrt-${{ inputs.release_version }}-${{ steps.source.outputs.ref_slug }}-${{ github.run_number }}
          name: ImmortalWrt ${{ inputs.release_version }} x86-64 Build
          body: |
            ## ImmortalWrt ${{ inputs.release_version }} x86-64

            - Requested source: `${{ inputs.version }}`
            - Resolved source: `${{ steps.source.outputs.display_version }}`
            - ImmortalWrt commit: `${{ steps.source.outputs.commit }}`
            - Configuration repository commit: `${{ github.sha }}`
            - Build run: `${{ github.run_number }}`

            ### Release assets

            - `ImmortalWrt-${{ inputs.release_version }}-x86-64-generic-image-efi.iso`
            - `ImmortalWrt-${{ inputs.release_version }}-x86-64-generic-ext4-combined-efi.vmdk.gz`
            - `ImmortalWrt-${{ inputs.release_version }}-x86-64-generic-ext4-combined-efi.img.gz`
            - `SHA256SUMS`
            - `build-info.txt`
          files: |
            release/ImmortalWrt-${{ inputs.release_version }}-x86-64-generic-image-efi.iso
            release/ImmortalWrt-${{ inputs.release_version }}-x86-64-generic-ext4-combined-efi.vmdk.gz
            release/ImmortalWrt-${{ inputs.release_version }}-x86-64-generic-ext4-combined-efi.img.gz
            release/SHA256SUMS
            release/build-info.txt
          fail_on_unmatched_files: true
